name: Build MSMSF RACING APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: RESTORE Juken-main.zip BRUTE FORCE
        run: |
          echo "=== Zip sekarang ==="
          ls -lh *.zip || true
          
          if [ ! -f Juken-main.zip ]; then
            echo "Cari Juken-main.zip di SEMUA commit..."
            # List semua commit, cek satu-satu
            for C in $(git rev-list --all); do
              if git ls-tree -r --name-only $C 2>/dev/null | grep -q "Juken-main.zip"; then
                echo "KETEMU DI COMMIT $C"
                git show $C:Juken-main.zip > Juken-main.zip
                echo "Berhasil restore! Ukuran:"
                ls -lh Juken-main.zip
                break
              fi
            done
            
            # Coba hash yang lu pernah punya
            if [ ! -f Juken-main.zip ] || [ ! -s Juken-main.zip ]; then
              echo "Coba hash a630993..."
              git show a630993:Juken-main.zip > Juken-main.zip 2>/dev/null || true
              git show 3eecb74:Juken-main.zip > Juken-main.zip 2>/dev/null || true
            fi
          fi

          echo "=== FINAL ==="
          ls -lh *.zip || true
          du -h Juken-main.zip || echo "GAGAL TOTAL, file tidak ada di history"

      - name: Build Hybrid
        run: |
          rm -rf source && mkdir source
          unzip -o -q Juken-main.zip -d source
          unzip -o -q Juken-blackwhite-dark-light.zip -d source || true
          find source -name "gradlew" -type f

      - name: Build APK
        run: |
          GP=$(find source -type f -name "gradlew" | head -n 1)
          echo "Gradlew: $GP"
          [ -z "$GP" ] && echo "Gak ketemu gradlew" && exit 1
          DIR=$(dirname "$GP")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-V12-BLACKWHITE
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Release V12
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.12
          name: MSMSF RACING V.12
          files: "**/build/outputs/apk/debug/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
